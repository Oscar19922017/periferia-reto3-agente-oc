<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agente Periferia</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <style>
    :root {
      --bg: #f6f7f5; --panel: #ffffff; --text: #1d2321; --muted: #66706c; --border: #dfe3e0;
      --accent: #1f6b45; --accent-text: #ffffff; --user: #e5f1ea;
      --tool: #f1f3f2; --ok: #1f7a4a; --err: #b3261e; --warn-bg: #fff4d6; --warn-border: #d9a400;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121614; --panel: #1a1f1d; --text: #e6ebe8; --muted: #9aa5a0; --border: #2d3431;
        --accent: #3fa772; --accent-text: #0d1310; --user: #1f3329;
        --tool: #222826; --ok: #5cc98f; --err: #f2867d; --warn-bg: #3a3014; --warn-border: #d9a400;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    .app { max-width: 920px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; padding: 0 16px; }
    header { padding: 14px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    header h1 { font-size: 17px; margin: 0; }
    header small { color: var(--muted); }
    header button { background: none; border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    #mensajes { flex: 1; overflow-y: auto; padding: 16px 0; display: flex; flex-direction: column; gap: 12px; }
    .msg { padding: 10px 14px; border-radius: 12px; max-width: 100%; overflow-x: auto; }
    .msg.user { background: var(--user); align-self: flex-end; max-width: 80%; white-space: pre-wrap; }
    .msg.agent { background: var(--panel); border: 1px solid var(--border); }
    .msg.agent.confirmar { border: 2px solid var(--warn-border); background: var(--warn-bg); }
    .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--warn-border); color: #1d1600; margin-bottom: 6px; }
    .msg table { border-collapse: collapse; margin: 8px 0; font-size: 14px; }
    .msg th, .msg td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
    .msg pre { background: var(--tool); padding: 8px; border-radius: 8px; overflow-x: auto; }
    .tools { display: flex; flex-direction: column; gap: 4px; }
    details.tool { background: var(--tool); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
    details.tool summary { cursor: pointer; font-family: ui-monospace, Consolas, monospace; }
    details.tool .ok { color: var(--ok); } details.tool .err { color: var(--err); }
    details.tool pre { white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; font-size: 12px; }
    .pensando { color: var(--muted); font-style: italic; }
    .acciones { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    form { display: flex; gap: 8px; padding: 12px 0 16px; border-top: 1px solid var(--border); }
    textarea { flex: 1; resize: none; font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); color: var(--text); min-height: 46px; max-height: 160px; }
    button.primario { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 10px; padding: 0 18px; font-weight: 600; cursor: pointer; }
    button.secundario { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div><h1>Agente Periferia</h1><small id="estado">Conectando…</small></div>
      <button id="nueva" type="button">Nueva sesión</button>
    </header>
    <main id="mensajes" aria-live="polite"></main>
    <form id="form">
      <textarea id="entrada" placeholder="Escribe una instrucción… (Enter envía, Shift+Enter salto de línea)" required></textarea>
      <button class="primario" id="enviar">Enviar</button>
    </form>
  </div>
  <script>
    const $ = (id) => document.getElementById(id)
    const nuevaSesion = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()))
    let sessionId = nuevaSesion()

    const md = (texto) => {
      if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(texto))
      const div = document.createElement("div"); div.textContent = texto; return div.innerHTML.replace(/\n/g, "<br>")
    }

    function agregar(clase, html) {
      const div = document.createElement("div")
      div.className = "msg " + clase
      div.innerHTML = html
      $("mensajes").appendChild(div)
      $("mensajes").scrollTop = $("mensajes").scrollHeight
      return div
    }

    function herramientas(toolCalls) {
      const cont = document.createElement("div")
      cont.className = "tools"
      for (const t of toolCalls) {
        const d = document.createElement("details")
        d.className = "tool"
        const sum = document.createElement("summary")
        sum.innerHTML = `🔧 ${t.nombre} <span class="${t.ok ? "ok" : "err"}">${t.ok ? "✓ ok" : "✗ error"}</span>`
        const pre = document.createElement("pre")
        pre.textContent = "Argumentos: " + JSON.stringify(t.argumentos, null, 2) + "\n\nResultado: " + t.resumen
        d.append(sum, pre)
        cont.appendChild(d)
      }
      return cont
    }

    async function enviar(texto) {
      agregar("user", "").textContent = texto
      const pensando = agregar("agent pensando", "Pensando…")
      $("enviar").disabled = true
      try {
        const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sessionId, message: texto }) })
        const data = await r.json()
        pensando.remove()
        if (!r.ok) { agregar("agent", md("⚠️ " + (data.error || "Error del servidor"))); return }
        if (data.toolCalls?.length) $("mensajes").appendChild(herramientas(data.toolCalls))
        const div = agregar("agent" + (data.needsConfirmation ? " confirmar" : ""), (data.needsConfirmation ? '<span class="badge">⚠ Requiere tu confirmación</span>' : "") + md(data.reply || "(sin respuesta)"))
        if (data.needsConfirmation) {
          const acc = document.createElement("div"); acc.className = "acciones"
          for (const [txt, msg] of [["Confirmo", "Confirmo, procede."], ["No, cancelar", "No confirmo, no ejecutes la acción."]]) {
            const b = document.createElement("button"); b.className = "secundario"; b.type = "button"; b.textContent = txt
            b.onclick = () => { acc.remove(); enviar(msg) }
            acc.appendChild(b)
          }
          div.appendChild(acc)
        }
      } catch (e) {
        pensando.remove()
        agregar("agent", md("⚠️ No hay conexión con el servidor. Intenta de nuevo."))
      } finally {
        $("enviar").disabled = false
        $("mensajes").scrollTop = $("mensajes").scrollHeight
      }
    }

    $("form").addEventListener("submit", (e) => {
      e.preventDefault()
      const texto = $("entrada").value.trim()
      if (!texto) return
      $("entrada").value = ""
      enviar(texto)
    })
    $("entrada").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit() }
    })
    $("nueva").onclick = () => { sessionId = nuevaSesion(); $("mensajes").innerHTML = "" }

    fetch("/api/health").then((r) => r.json()).then((h) => { $("estado").textContent = `${h.provider} · ${h.model}` }).catch(() => { $("estado").textContent = "Servidor no disponible" })
  </script>
</body>
</html>
